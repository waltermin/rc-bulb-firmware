; Trampoline migrator for the Kauf RGBWW BR30 bulb (4 MB / esp07s).
;
; A minimal Arduino sketch that the stock ESPHome eboot bootloader boots cleanly
; at 0x1000 after the ESPHome DFU web upload. It carries a personalized RTOS
; full-flash image (pre-positioned at flash 0x110000 by the packaging tool),
; validates it (CRC-32), then rewrites low flash from IRAM and resets into the
; new ESP8266_RTOS_SDK firmware. See README.md.
;
; Pinned to the EXACT platform/core the ESPHome bench build used
; (kauf-rgbww-bulbs/.esphome/build/bench-bulb/platformio.ini) so the eboot in
; sector 0 of this image and the eboot_command ABI match the device.

[env:migrator]
platform = platformio/espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@~3.30102.0
board = esp07s
framework = arduino
board_build.flash_mode = dout          ; match stock; raw SPI ops are controller-agnostic
board_build.ldscript = eagle.flash.4m.ld
build_flags =
    -DNO_GLOBAL_SERIAL1
monitor_speed = 74880
; output: .pio/build/migrator/firmware.bin == eboot@0x0 + migrator app@0x1000
