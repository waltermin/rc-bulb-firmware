; rc-switch-firmware — Tuya T1-2S-NL (BK7238)
;
; LibreTiny provides the toolchain + vendored Beken SDK + image packaging.
; All control-path logic is ours (src/ + main/); the Arduino layer is used
; only as SDK glue (serial, GPIO, scheduler).

[env:t1-2s]
platform = libretiny
board = t1-2s
framework = arduino
build_flags =
    -I main
build_src_filter = +<*> +<../main/protocol.c> +<../main/controller.c>
monitor_speed = 115200
